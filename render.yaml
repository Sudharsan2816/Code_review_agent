services:
  - type: web
    name: code-review-agent
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: LLM_PROVIDER
        value: nvidia
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_MODEL
        value: nvidia/llama-3.3-nemotron-super-49b-v1
      - key: REQUIRE_HUMAN_APPROVAL
        value: "true"
      - key: MAX_DIFF_CHARS
        value: "60000"
      - key: API_AUTH_TOKEN
        generateValue: true
      - key: GITHUB_WEBHOOK_SECRET
        generateValue: true
      - key: GITHUB_TOKEN
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
